<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>테니스 게임 매칭</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Wanted Sans Variable", "Wanted Sans", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: #1B1B1E; color: #fff; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 16px; }

  /* Header */
  .header {
    padding: 8px 0 8px;
    text-align: left;
  }
  .header-sub { font-size: 14px; font-weight: 500; color: #8E8E93; margin-bottom: 4px; }
  .header h1 {
    font-size: 20px; font-weight: 600; color: #fff;
    line-height: 1.25; letter-spacing: -0.2px;
  }

  /* Section Title */
  .section-title {
    font-size: 16px; font-weight: 600; color: #e8e8e8;
    padding: 16px 0 12px; letter-spacing: -0.2px;
  }

  /* Cards */
  .card {
    background: #2C2C30; border-radius: 20px; padding: 16px;
    margin-bottom: 12px;
  }

  /* Form */
  .form-label {
    font-size: 13px; font-weight: 600; color: #8E8E93;
    letter-spacing: -0.2px;
    margin-bottom: 8px; display: block;
  }
  .form-input {
    width: 100%; padding: 14px 16px; border: none;
    background: #3A3A3C; border-radius: 14px;
    font-size: 15px; font-family: inherit; color: #fff;
    transition: background 0.2s;
  }
  .form-input:focus { outline: none; background: #48484A; }
  .form-input::placeholder { color: #636366; }
  textarea.form-input { resize: none; min-height: 52px; line-height: 1.5; }
  .hint { font-size: 12px; color: #8E8E93; margin-top: 6px; padding-left: 2px; }

  /* Tag Input */
  .tag-container {
    display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; cursor: text;
  }
  .tag {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px 8px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 500;
    letter-spacing: -0.2px;
    cursor: grab; user-select: none;
    background: #48484a90;
  }
  .tag:active { cursor: grabbing; }
  .tag.dragging { opacity: 0.3; transform: scale(0.95); pointer-events: none; }
  @keyframes tagIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .tag.male { color: #E5E5EA; }
  .tag.female { color: #E5E5EA; }
  .tag .tag-remove {
    display: flex; align-items: center; justify-content: center;
    width: 20px; height: 20px;
    border: none; background: #636366; padding: 0;
    cursor: pointer; border-radius: 50%;
    transition: background 0.15s;
    color: #ffffff; -webkit-appearance: none; appearance: none;
  }
  .tag .tag-remove svg { stroke: currentColor; }
  .tag .tag-remove:hover { background: #8E8E93; }
  .tag-input {
    border: none; background: none; outline: none;
    font-size: 14px; font-weight: 500; font-family: inherit; color: #fff;
    min-width: 80px; flex: 1;
    letter-spacing: -0.2px;
    padding: 4px;
    height: 36px; line-height: 36px;
  }
  .tag-input::placeholder { color: #8E8E93; }

  .stepper {
    display: flex; align-items: center; gap: 0;
    background: #3A3A3C; border-radius: 14px; overflow: hidden;
  }
  .stepper-btn {
    width: 40px; height: 46px; border: none; background: none;
    color: lab(91.64% 0 -0.01); font-size: 22px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
    line-height: 1; padding: 0;
  }
  .stepper-btn:active { background: rgba(255,255,255,0.1); }
  .stepper-input {
    flex: 1; text-align: center; background: none !important;
    border-radius: 0 !important; padding: 14px 0 !important;
    -moz-appearance: textfield;
    font-feature-settings: "ss01" 1;
  }
  .stepper-input::-webkit-outer-spin-button,
  .stepper-input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }

  .form-group { margin-bottom: 16px; }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .form-row-3 .form-group { flex: 1; min-width: 0; }

  .toggle-wrap {
    display: flex; position: relative;
    background: #3A3A3C; border-radius: 12px;
    padding: 3px; cursor: pointer; user-select: none;
    height: 46px;
  }
  .toggle-option {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: #636366;
    position: relative; z-index: 1;
    transition: color 0.2s; letter-spacing: -0.2px;
  }
  .toggle-option.active { color: #fff; }
  .toggle-slider {
    position: absolute; top: 3px; left: 3px;
    width: calc(50% - 3px); height: calc(100% - 6px);
    background: #636366; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    transition: transform 0.25s ease;
  }
  .toggle-slider.right {
    transform: translateX(100%);
  }

  .btn {
    display: block; width: 100%; padding: 16px;
    background: #3182F6; color: #fff;
    border: none; border-radius: 16px;
    font-size: 16px; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: transform 0.1s, opacity 0.2s;
    letter-spacing: -0.2px;
  }
  .btn:active { transform: scale(0.98); opacity: 0.9; }

  .error-msg {
    background: rgba(255,59,48,0.15); color: #FF6961; padding: 12px 16px;
    border-radius: 14px; margin-bottom: 12px; display: none;
    font-size: 14px; font-weight: 500;
  }

  /* Results */
  .results { display: flex; flex-direction: column; gap: 12px; }

  .game-card {
    border-radius: 20px; overflow: hidden;
    padding: 20px 20px 16px;
  }
  .game-card:nth-child(3n+1) { background: #2C2C30; }
  .game-card:nth-child(3n+2) { background: #2D2A1F; }
  .game-card:nth-child(3n+3) { background: #1F2D28; }

  .game-title {
    font-size: 22px; font-weight: 800; color: #fff;
    margin-bottom: 16px; letter-spacing: -0.2px;
  }

  .court-block { margin-bottom: 14px; }
  .court-block:last-child { margin-bottom: 0; }

  .court-type-badge {
    display: inline-block; padding: 5px 12px;
    border-radius: 10px; font-size: 12px; font-weight: 700;
    margin-bottom: 8px; letter-spacing: -0.2px;
  }
  .court-type-badge.mens { background: rgba(49,130,246,0.2); color: #6AADFF; }
  .court-type-badge.womens { background: rgba(236,72,153,0.2); color: #F472B6; }
  .court-type-badge.mixed { background: rgba(139,92,246,0.2); color: #A78BFA; }
  .court-type-badge.rest { background: rgba(142,142,147,0.15); color: #8E8E93; }

  .player-list {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding-left: 2px;
  }
  .player-chip {
    padding: 7px 14px; border-radius: 12px;
    font-size: 14px; font-weight: 600;
    letter-spacing: -0.2px;
  }
  .player-chip.male { background: rgba(49,130,246,0.15); color: #6AADFF; }
  .player-chip.female { background: rgba(236,72,153,0.15); color: #F472B6; }
  .player-chip.rest-male { background: rgba(142,142,147,0.1); color: #636366; }
  .player-chip.rest-female { background: rgba(142,142,147,0.1); color: #636366; }

  /* Summary */
  .summary-card {
    background: #2C2C30; border-radius: 20px;
    padding: 20px;
  }
  .stat-group-label {
    font-size: 13px; font-weight: 600; color: #8E8E93;
    margin-bottom: 8px; letter-spacing: -0.2px;
  }
  .stat-group-label + .stat-tags { margin-bottom: 16px; }
  .stat-group-label + .stat-tags:last-child { margin-bottom: 0; }
  .stat-tags {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .stat-tag {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px 8px 16px; border-radius: 999px;
    font-size: 14px; font-weight: 500; color: #E5E5EA;
    letter-spacing: -0.2px;
    background: #48484a90;
  }
  .stat-badge {
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    font-size: 12px; font-weight: 700;
  }
  .stat-badge.play { background: rgba(49,130,246,0.25); color: #6AADFF; }
  .stat-badge.rest { background: rgba(255,59,48,0.25); color: #FF6961; }

  /* Divider */
  .section-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 24px 0 16px; padding: 0 4px;
  }
  .section-divider span {
    font-size: 13px; font-weight: 600; color: #636366;
    text-transform: uppercase; letter-spacing: -0.2px; white-space: nowrap;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: #3A3A3C;
  }

  /* Action bar */
  .action-bar {
    display: none; gap: 8px; margin-bottom: 12px; margin-top: 0;
  }
  .action-bar.visible { display: flex; }
  .btn-action {
    display: flex; align-items: center; gap: 6px; flex: 1;
    justify-content: center;
    padding: 0 16px; height: 44px; background: #2C2C30; color: #fff;
    border: none; border-radius: 14px;
    font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    letter-spacing: -0.2px;
  }
  .btn-action:active { transform: scale(0.96); }
  .btn-action svg { width: 16px; height: 16px; }
  .btn-action.copied { background: #34C759; color: #fff; }

  /* Text result */
  .text-result {
    background: #2C2C30; border-radius: 20px; padding: 20px;
    margin-bottom: 12px;
    white-space: pre-wrap; font-size: 14px; line-height: 1.8;
    font-family: inherit; color: #fff;
    letter-spacing: -0.2px;
  }
  .text-result .game-block { padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid #3A3A3C; }
  .text-result .game-block:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .text-result .game-label {
    font-size: 16px; font-weight: 800; margin-bottom: 4px;
    letter-spacing: -0.2px; color: #fff;
  }
  .text-result .court-line {
    font-size: 14px; font-weight: 500; color: #E5E5EA;
    padding-left: 2px;
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>Tennis Game Matching</h1>
  </div>

  <div class="section-title">남자 참가자</div>
  <div class="card">
    <div class="tag-container" id="maleTagContainer" onclick="this.querySelector('.tag-input').focus()">
      <input class="tag-input" id="maleInput" placeholder="이름 입력 후 엔터" data-gender="male">
    </div>
  </div>

  <div class="section-title">여자 참가자</div>
  <div class="card">
    <div class="tag-container" id="femaleTagContainer" onclick="this.querySelector('.tag-input').focus()">
      <input class="tag-input" id="femaleInput" placeholder="이름 입력 후 엔터" data-gender="female">
    </div>
  </div>

  <div class="section-title">게임 설정</div>
  <div class="card">
    <div class="form-row form-row-3">
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">코트 수</label>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepValue('courtCount',-1)"><svg width="10" height="16" viewBox="0 0 10 16"><path d="M8 2L2 8L8 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
          <input class="form-input stepper-input" type="number" id="courtCount" value="2" min="1" max="10">
          <button class="stepper-btn" onclick="stepValue('courtCount',1)"><svg width="10" height="16" viewBox="0 0 10 16"><path d="M2 2L8 8L2 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">게임 수</label>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepValue('gameCount',-1)"><svg width="10" height="16" viewBox="0 0 10 16"><path d="M8 2L2 8L8 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
          <input class="form-input stepper-input" type="number" id="gameCount" value="6" min="1" max="50">
          <button class="stepper-btn" onclick="stepValue('gameCount',1)"><svg width="10" height="16" viewBox="0 0 10 16"><path d="M2 2L8 8L2 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></button>
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">시작 게임</label>
        <div class="toggle-wrap" id="toggleWrap" onclick="toggleStartType()">
          <div class="toggle-option active" id="optSingle">남/여복</div>
          <div class="toggle-option" id="optMixed">혼복</div>
          <div class="toggle-slider" id="toggleSlider"></div>
        </div>
        <input type="hidden" id="mixedStart" value="0">
      </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>
  <button class="btn" style="margin-top:20px; margin-bottom:12px;" onclick="generateGames()">게임 생성</button>

  <div class="action-bar" id="actionBar">
    <button class="btn-action" onclick="refreshGames()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      다시 섞기
    </button>
    <button class="btn-action" id="copyBtn" onclick="copyResult()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      복사하기
    </button>
  </div>
  <div id="results"></div>
</div>

<script>
// Tag input system
function createTag(container, name, gender) {
  name = name.trim();
  if (!name) return;
  const tag = document.createElement('span');
  tag.className = 'tag ' + gender;
  tag.dataset.name = name;
  tag.innerHTML = `${name}<button class="tag-remove" onclick="removeTag(this)"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2.5 2.5L7.5 7.5M7.5 2.5L2.5 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>`;
  const input = container.querySelector('.tag-input');
  container.insertBefore(tag, input);
}

function removeTag(btn) {
  btn.closest('.tag').remove();
}

function getTagNames(containerId) {
  return Array.from(document.getElementById(containerId).querySelectorAll('.tag'))
    .map(t => t.dataset.name);
}

function handleTagInput(e) {
  const input = e.target;
  const container = input.closest('.tag-container');
  const gender = input.dataset.gender;

  if (e.isComposing) return;
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = input.value.replace(',', '').trim();
    if (val) {
      createTag(container, val, gender);
      input.value = '';
    }
  }
  if (e.key === 'Backspace' && input.value === '') {
    const tags = container.querySelectorAll('.tag');
    if (tags.length > 0) tags[tags.length - 1].remove();
  }
}

function handleTagPaste(e) {
  e.preventDefault();
  const input = e.target;
  const container = input.closest('.tag-container');
  const gender = input.dataset.gender;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  text.split(',').map(s => s.trim()).filter(Boolean).forEach(name => {
    createTag(container, name, gender);
  });
}

document.getElementById('maleInput').addEventListener('keydown', handleTagInput);
document.getElementById('maleInput').addEventListener('paste', handleTagPaste);
document.getElementById('femaleInput').addEventListener('keydown', handleTagInput);
document.getElementById('femaleInput').addEventListener('paste', handleTagPaste);

// Drag & drop reorder
let dragTag = null;
let isAnimating = false;
let lastSwapTime = 0;

function flipAnimate(container, skipTag) {
  const tags = [...container.querySelectorAll('.tag')];
  const firstRects = new Map();
  tags.forEach(t => firstRects.set(t, t.getBoundingClientRect()));
  return function play() {
    isAnimating = true;
    let animCount = 0;
    tags.forEach(t => {
      if (t === skipTag) return;
      const first = firstRects.get(t);
      if (!first) return;
      const last = t.getBoundingClientRect();
      const dx = first.left - last.left;
      const dy = first.top - last.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      animCount++;
      t.style.transition = 'none';
      t.style.transform = `translate(${dx}px, ${dy}px)`;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          t.style.transition = 'transform 0.2s cubic-bezier(0.2, 0, 0, 1)';
          t.style.transform = '';
          t.addEventListener('transitionend', () => {
            t.style.transition = '';
            animCount--;
            if (animCount <= 0) isAnimating = false;
          }, { once: true });
        });
      });
    });
    if (animCount === 0) isAnimating = false;
  };
}

function initDrag(tag) {
  tag.draggable = true;
  tag.addEventListener('dragstart', (e) => {
    dragTag = tag;
    const ghost = tag.cloneNode(true);
    ghost.style.cssText = `
      position: absolute; top: -9999px; left: -9999px;
      border-radius: 999px; background: #48484a90;
      padding: 8px 12px 8px 16px; font-size: 14px; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      color: #E5E5EA; font-family: inherit;
    `;
    document.body.appendChild(ghost);
    e.dataTransfer.setDragImage(ghost, ghost.offsetWidth / 2, ghost.offsetHeight / 2);
    setTimeout(() => {
      tag.classList.add('dragging');
      document.body.removeChild(ghost);
    }, 0);
    e.dataTransfer.effectAllowed = 'move';
  });
  tag.addEventListener('dragend', () => {
    tag.classList.remove('dragging');
    dragTag = null;
  });

  // Touch support
  let touchTimeout = null;
  let touchGhost = null;
  tag.addEventListener('touchstart', (e) => {
    if (e.target.closest('.tag-remove')) return;
    touchTimeout = setTimeout(() => {
      e.preventDefault();
      dragTag = tag;
      tag.classList.add('dragging');
      const rect = tag.getBoundingClientRect();
      touchGhost = tag.cloneNode(true);
      touchGhost.classList.remove('dragging');
      touchGhost.style.cssText = `
        position: fixed; z-index: 9999; pointer-events: none;
        border-radius: 999px; background: #48484a90;
        padding: 8px 12px 8px 16px; font-size: 14px; font-weight: 500;
        display: flex; align-items: center; gap: 8px;
        color: #E5E5EA; font-family: inherit; opacity: 0.9;
        left: ${rect.left}px; top: ${rect.top}px;
        width: ${rect.width}px;
      `;
      document.body.appendChild(touchGhost);
    }, 200);
  }, { passive: false });

  tag.addEventListener('touchmove', (e) => {
    if (!dragTag || dragTag !== tag) {
      clearTimeout(touchTimeout);
      touchTimeout = null;
      return;
    }
    e.preventDefault();
    const touch = e.touches[0];
    if (touchGhost) {
      touchGhost.style.left = (touch.clientX - touchGhost.offsetWidth / 2) + 'px';
      touchGhost.style.top = (touch.clientY - touchGhost.offsetHeight / 2) + 'px';
    }
    if (isAnimating) return;
    const now = Date.now();
    if (now - lastSwapTime < 250) return;
    const container = tag.closest('.tag-container');
    const tags = [...container.querySelectorAll('.tag:not(.dragging)')];
    let closest = null;
    let closestDist = Infinity;
    for (const t of tags) {
      const rect = t.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dist = Math.hypot(touch.clientX - cx, touch.clientY - cy);
      if (dist < closestDist) { closestDist = dist; closest = t; }
    }
    if (!closest) return;
    const allTags = [...container.querySelectorAll('.tag')];
    const dragIdx = allTags.indexOf(dragTag);
    const hoverIdx = allTags.indexOf(closest);
    if (dragIdx === hoverIdx) return;
    const rect = closest.getBoundingClientRect();
    const midX = rect.left + rect.width / 2;
    if (dragIdx < hoverIdx && touch.clientX < midX) return;
    if (dragIdx > hoverIdx && touch.clientX > midX) return;
    lastSwapTime = now;
    const play = flipAnimate(container, dragTag);
    if (dragIdx < hoverIdx) {
      closest.after(dragTag);
    } else {
      closest.before(dragTag);
    }
    play();
  }, { passive: false });

  tag.addEventListener('touchend', () => {
    clearTimeout(touchTimeout);
    touchTimeout = null;
    if (dragTag === tag) {
      tag.classList.remove('dragging');
      dragTag = null;
    }
    if (touchGhost) {
      touchGhost.remove();
      touchGhost = null;
    }
  });
}

function initContainer(container) {
  container.addEventListener('dragover', (e) => {
    e.preventDefault();
    if (!dragTag || isAnimating) return;
    const now = Date.now();
    if (now - lastSwapTime < 250) return;
    const tags = [...container.querySelectorAll('.tag:not(.dragging)')];
    let closest = null;
    let closestDist = Infinity;
    for (const t of tags) {
      const rect = t.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (dist < closestDist) { closestDist = dist; closest = t; }
    }
    if (!closest) return;
    const allTags = [...container.querySelectorAll('.tag')];
    const dragIdx = allTags.indexOf(dragTag);
    const hoverIdx = allTags.indexOf(closest);
    if (dragIdx === hoverIdx) return;
    const rect = closest.getBoundingClientRect();
    const midX = rect.left + rect.width / 2;
    if (dragIdx < hoverIdx && e.clientX < midX) return;
    if (dragIdx > hoverIdx && e.clientX > midX) return;
    lastSwapTime = now;
    const play = flipAnimate(container, dragTag);
    if (dragIdx < hoverIdx) {
      closest.after(dragTag);
    } else {
      closest.before(dragTag);
    }
    play();
  });
  container.addEventListener('drop', (e) => {
    e.preventDefault();
  });
}

initContainer(document.getElementById('maleTagContainer'));
initContainer(document.getElementById('femaleTagContainer'));

// Patch createTag to enable drag
const _origCreateTag = createTag;
createTag = function(container, name, gender) {
  _origCreateTag(container, name, gender);
  const input = container.querySelector('.tag-input');
  const tag = input.previousElementSibling;
  if (tag && tag.classList.contains('tag')) initDrag(tag);
};


function stepValue(id, delta) {
  const input = document.getElementById(id);
  const val = parseInt(input.value) + delta;
  const min = parseInt(input.min);
  const max = parseInt(input.max);
  if (val >= min && val <= max) input.value = val;
}

function generateGames() {
  const errorEl = document.getElementById('errorMsg');
  const resultsEl = document.getElementById('results');
  errorEl.style.display = 'none';
  resultsEl.innerHTML = '';

  const maleRaw = getTagNames('maleTagContainer');
  const femaleRaw = getTagNames('femaleTagContainer');
  const courts = parseInt(document.getElementById('courtCount').value);
  const games = parseInt(document.getElementById('gameCount').value);
  const mixedStart = document.getElementById('mixedStart').value === '1';

  const males = [...maleRaw];
  const females = [...femaleRaw];

  const totalPlayers = males.length + females.length;
  const playersPerRound = courts * 4;

  if (males.length < 2) return showError('남자 참가자를 최소 2명 이상 입력하세요.');
  if (females.length < 2) return showError('여자 참가자를 최소 2명 이상 입력하세요.');
  if (totalPlayers < playersPerRound) return showError(`코트 ${courts}개에 최소 ${playersPerRound}명이 필요합니다. (현재 ${totalPlayers}명)`);
  if (courts < 1 || games < 1) return showError('코트 개수와 게임 수는 1 이상이어야 합니다.');

  const allPlayers = [
    ...males.map(n => ({ name: n, gender: 'M' })),
    ...females.map(n => ({ name: n, gender: 'F' })),
  ];

  const restCount = {};
  const playCount = {};
  const pairCount = {};
  const lastRested = {};
  const typeUsed = { mens: 0, womens: 0, mixed: 0 };
  const malePlayers = allPlayers.filter(p => p.gender === 'M');
  const femalePlayers = allPlayers.filter(p => p.gender === 'F');

  allPlayers.forEach(p => {
    restCount[p.name] = 0;
    playCount[p.name] = 0;
    lastRested[p.name] = -999;
  });

  function getPairKey(a, b) { return [a, b].sort().join('|'); }
  function getPairScore(names) {
    let score = 0;
    for (let i = 0; i < names.length; i++)
      for (let j = i + 1; j < names.length; j++)
        score += (pairCount[getPairKey(names[i], names[j])] || 0);
    return score;
  }

  // Generate all possible game type combos for N courts
  function allTypeCombos(n) {
    const types = ['mens', 'womens', 'mixed'];
    if (n === 0) return [[]];
    const sub = allTypeCombos(n - 1);
    const result = [];
    for (const t of types)
      for (const s of sub)
        result.push([t, ...s]);
    return result;
  }
  const combos = allTypeCombos(courts);

  // Fisher-Yates shuffle
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Pick rest candidates for a given gender group and count
  function pickRestCandidates(group, count, roundIdx) {
    if (count <= 0) return [];
    if (roundIdx === 0) {
      // First game: tag order priority — rest players from the end of the list
      return group.slice(group.length - count);
    }
    const eligible = group;
    // Shuffle first, then stable-sort by restCount so equal-rest players are randomized
    const canRest = shuffle(eligible.filter(p => lastRested[p.name] !== roundIdx - 1))
      .sort((a, b) => restCount[a.name] - restCount[b.name]);
    const mustPlay = shuffle(eligible.filter(p => lastRested[p.name] === roundIdx - 1))
      .sort((a, b) => restCount[a.name] - restCount[b.name]);
    const picked = [];
    for (const p of canRest) { if (picked.length >= count) break; picked.push(p); }
    for (const p of mustPlay) { if (picked.length >= count) break; picked.push(p); }
    return picked;
  }

  // Score a rest selection: lower = more balanced rest across ALL players
  function restBalanceScore(mResting, fResting) {
    // Simulate rest counts after this round
    const simRest = {};
    allPlayers.forEach(p => simRest[p.name] = restCount[p.name]);
    mResting.forEach(p => simRest[p.name]++);
    fResting.forEach(p => simRest[p.name]++);
    const vals = Object.values(simRest);
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length;
    return vals.reduce((sum, v) => sum + (v - mean) ** 2, 0);
  }

  function pickDiverseGroup(pool, count, roundIdx) {
    if (pool.length <= count) return [...pool];
    if (roundIdx === 0) {
      // First game: pick in tag order (front of pool)
      return pool.slice(0, count);
    }
    let bestGroup = pool.slice(0, count);
    let bestScore = getPairScore(bestGroup.map(p => p.name));
    const maxAttempts = Math.min(40, pool.length * 4);
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      const shuffled = shuffle(pool);
      shuffled.sort((a, b) => playCount[a.name] - playCount[b.name]);
      const group = shuffled.slice(0, count);
      const score = getPairScore(group.map(p => p.name));
      if (score < bestScore) { bestScore = score; bestGroup = group; }
    }
    return bestGroup;
  }

  const schedule = [];

  for (let g = 0; g < games; g++) {
    const restNeeded = totalPlayers - playersPerRound;

    // 1) Find best game type combo that maximizes rest balance
    let bestCombo = null;
    let bestScore = Infinity;
    let bestMRest = [], bestFRest = [];

    // First game: force combo based on mixedStart checkbox
    let comboPool = combos;
    if (g === 0) {
      if (mixedStart) {
        comboPool = [Array(courts).fill('mixed')];
      } else {
        // Force mens + womens (one each if 2 courts, alternate if more)
        const forced = [];
        for (let c = 0; c < courts; c++) forced.push(c % 2 === 0 ? 'mens' : 'womens');
        comboPool = [forced];
      }
    }

    for (const combo of comboPool) {
      let mNeeded = 0, fNeeded = 0;
      for (const t of combo) {
        if (t === 'mens') mNeeded += 4;
        else if (t === 'womens') fNeeded += 4;
        else { mNeeded += 2; fNeeded += 2; }
      }
      // Feasibility: enough players of each gender
      if (mNeeded > malePlayers.length || fNeeded > femalePlayers.length) continue;

      const mRestCount = malePlayers.length - mNeeded;
      const fRestCount = femalePlayers.length - fNeeded;
      if (mRestCount < 0 || fRestCount < 0) continue;
      if (mRestCount + fRestCount !== restNeeded) continue;

      // Pick who would rest with this combo
      const mRest = pickRestCandidates(malePlayers, mRestCount, g);
      const fRest = pickRestCandidates(femalePlayers, fRestCount, g);

      // Check consecutive rest constraint
      const consecutiveRests = [...mRest, ...fRest].filter(p => lastRested[p.name] === g - 1).length;

      // Score: 50/50 ratio (primary) + rest balance (secondary) + consecutive penalty
      const comboTypeCount = { mens: 0, womens: 0, mixed: 0 };
      combo.forEach(t => comboTypeCount[t]++);
      let score = 0;
      if (g >= 1) {
        // Simulate cumulative type counts after this combo
        const simMixed = typeUsed.mixed + comboTypeCount.mixed;
        const simMens = typeUsed.mens + comboTypeCount.mens;
        const simWomens = typeUsed.womens + comboTypeCount.womens;
        const simTotal = simMixed + simMens + simWomens;

        // Primary: cumulative mixed ratio should approach 50%
        const mixedRatio = simMixed / simTotal;
        score += Math.abs(mixedRatio - 0.5) * 200;

        // Secondary: mens and womens should be balanced within non-mixed
        const nonMixed = simMens + simWomens;
        if (nonMixed > 0) {
          const mensRatio = simMens / nonMixed;
          score += Math.abs(mensRatio - 0.5) * 50;
        }

        // Tertiary: rest balance
        score += restBalanceScore(mRest, fRest);
      } else {
        score += restBalanceScore(mRest, fRest);
        for (const t of ['mens', 'womens', 'mixed']) {
          score += (typeUsed[t] + comboTypeCount[t]) * 0.01;
        }
      }
      // Heavy penalty for consecutive rest
      score += consecutiveRests * 1000;

      if (score < bestScore) {
        bestScore = score;
        bestCombo = combo;
        bestMRest = mRest;
        bestFRest = fRest;
      }
    }

    // Fallback if no combo found (shouldn't happen)
    if (!bestCombo) {
      bestCombo = Array(courts).fill('mixed');
      bestMRest = [];
      bestFRest = [];
    }

    const resting = [...bestMRest, ...bestFRest];
    const restingNames = new Set(resting.map(r => r.name));
    const playingMales = malePlayers.filter(p => !restingNames.has(p.name));
    const playingFemales = femalePlayers.filter(p => !restingNames.has(p.name));

    // 2) Assign players to courts
    const usedPlayers = new Set();
    const courtAssignments = [];

    // Sort courts: constrained types first (mens/womens before mixed)
    const courtOrder = bestCombo.map((t, i) => ({ type: t, idx: i }))
      .sort((a, b) => { const o = { mens: 0, womens: 1, mixed: 2 }; return o[a.type] - o[b.type]; });

    for (const court of courtOrder) {
      if (court.type === 'mixed') {
        const mPool = playingMales.filter(p => !usedPlayers.has(p.name));
        const fPool = playingFemales.filter(p => !usedPlayers.has(p.name));
        const selected = pickDiverseGroup(mPool, 2, g).concat(pickDiverseGroup(fPool, 2, g));
        selected.forEach(p => usedPlayers.add(p.name));
        courtAssignments[court.idx] = { type: court.type, players: selected };
      } else {
        const pool = (court.type === 'mens' ? playingMales : playingFemales)
          .filter(p => !usedPlayers.has(p.name));
        const selected = pickDiverseGroup(pool, 4, g);
        selected.forEach(p => usedPlayers.add(p.name));
        courtAssignments[court.idx] = { type: court.type, players: selected };
      }
    }

    // 3) Update stats
    resting.forEach(r => { restCount[r.name]++; lastRested[r.name] = g; });
    bestCombo.forEach(t => typeUsed[t]++);
    courtAssignments.forEach(ca => {
      ca.players.forEach(p => playCount[p.name]++);
      const names = ca.players.map(p => p.name);
      for (let i = 0; i < names.length; i++)
        for (let j = i + 1; j < names.length; j++) {
          const key = getPairKey(names[i], names[j]);
          pairCount[key] = (pairCount[key] || 0) + 1;
        }
    });

    schedule.push({ round: g + 1, courts: courtAssignments, resting });
  }

  // Build plain text
  const typeLabels = { mens: '남자복식', womens: '여자복식', mixed: '혼성복식' };
  const courtLetters = 'ABCDEFGHIJ';

  let plainText = '';
  for (const round of schedule) {
    plainText += `게임 ${round.round}\n`;
    round.courts.forEach((court, ci) => {
      const names = court.players.map(p => p.name).join(', ');
      plainText += `${courtLetters[ci]}코트 (${typeLabels[court.type]}): ${names}\n`;
    });
    if (round.resting.length > 0) {
      plainText += `휴식: ${round.resting.map(r => r.name).join(', ')}\n`;
    }
    plainText += '\n';
  }
  window._lastResult = plainText.trim();

  // Render as styled text
  let html = '<div class="section-title">게임 결과</div><div class="text-result">';
  for (const round of schedule) {
    html += `<div class="game-block">`;
    html += `<div class="game-label">게임 ${round.round}</div>`;
    round.courts.forEach((court, ci) => {
      const names = court.players.map(p => p.name).join(', ');
      html += `<div class="court-line">${courtLetters[ci]}코트 (${typeLabels[court.type]}): ${names}</div>`;
    });
    if (round.resting.length > 0) {
      html += `<div class="court-line">휴식: ${round.resting.map(r => r.name).join(', ')}</div>`;
    }
    html += `</div>`;
  }
  html += '</div>';

  // Summary
  html += `<div class="section-title">참가자 통계</div>`;
  html += `<div class="summary-card">`;
  html += `<div class="stat-group-label">남자 참가자</div>`;
  html += `<div class="stat-tags">`;
  allPlayers.filter(p => p.gender === 'M').forEach(p => {
    html += `<div class="stat-tag">${p.name}<span class="stat-badge play">${playCount[p.name]}</span>`;
    if (restCount[p.name] > 0) {
      html += `<span class="stat-badge rest">${restCount[p.name]}</span>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  html += `<div class="stat-group-label">여자 참가자</div>`;
  html += `<div class="stat-tags">`;
  allPlayers.filter(p => p.gender === 'F').forEach(p => {
    html += `<div class="stat-tag">${p.name}<span class="stat-badge play">${playCount[p.name]}</span>`;
    if (restCount[p.name] > 0) {
      html += `<span class="stat-badge rest">${restCount[p.name]}</span>`;
    }
    html += `</div>`;
  });
  html += `</div></div>`;

  resultsEl.innerHTML = html;

  document.getElementById('actionBar').classList.add('visible');
  resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function toggleStartType() {
  const input = document.getElementById('mixedStart');
  const slider = document.getElementById('toggleSlider');
  const optSingle = document.getElementById('optSingle');
  const optMixed = document.getElementById('optMixed');
  if (input.value === '0') {
    input.value = '1';
    slider.classList.add('right');
    optSingle.classList.remove('active');
    optMixed.classList.add('active');
  } else {
    input.value = '0';
    slider.classList.remove('right');
    optMixed.classList.remove('active');
    optSingle.classList.add('active');
  }
}

function refreshGames() {
  generateGames();
}

function copyResult() {
  if (!window._lastResult) return;
  navigator.clipboard.writeText(window._lastResult).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.classList.add('copied');
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> 복사됨';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> 복사하기';
    }, 1500);
  });
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}
